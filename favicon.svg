<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded-square navy background -->
  <rect width="64" height="64" rx="14" fill="#1B3A5C"/>

  <!-- Outer target ring, subtle -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#5DCAA5" stroke-width="1.5" opacity="0.35"/>

  <!-- Teal arc across top — DTM arc cue -->
  <path d="M 14 30 Q 32 14 50 30" fill="none" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- The 'W' mark, white -->
  <path d="M 18 26 L 22.5 42 L 27 30 L 32 42 L 37 30 L 41.5 42 L 46 26"
        fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Center target dot -->
  <circle cx="32" cy="32" r="2" fill="#5DCAA5"/>
</svg>
